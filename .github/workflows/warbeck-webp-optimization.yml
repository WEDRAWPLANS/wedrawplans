name: Warbeck WebP 150KB asset check and optimize
on:
  push:
    branches:
      - feature/warbeck-total-refurb-20261117
    paths:
      - '.github/workflows/warbeck-webp-optimization.yml'
      - 'components/WarbeckFlagshipPage.tsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-warbeck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image encoder
        run: python -m pip install --quiet pillow
      - name: Recompress Warbeck originals and verify limits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image
          folder=Path("public/images/case-studies/warbeck-road")
          images=sorted(folder.glob("*.webp"))
          assert len(images)>=12, f"Expected at least 12 original Warbeck assets, found {len(images)}"
          MAX_BYTES=150_000
          for p in images:
              data=p.read_bytes()
              if len(data)>=MAX_BYTES:
                  picture=Image.open(BytesIO(data)).convert("RGB")
                  new=None
                  for quality in (78, 75, 72, 68, 64, 58, 52, 46):
                      out=BytesIO()
                      picture.save(out, format="WEBP", quality=quality, method=6, exact=True)
                      if len(out.getvalue())<MAX_BYTES:
                          new=out.getvalue()
                          break
                  assert new is not None, f"Cannot compress {p.name} below {MAX_BYTES} bytes"
                  p.write_bytes(new)
              assert p.stat().st_size<MAX_BYTES, f"{p} exceeds 150KB"
              Image.open(p).verify()
              print(f"{p.name}: {p.stat().st_size} bytes")
          PY
      - name: Commit optimized Warbeck WebP without changing any other project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/case-studies/warbeck-road/*.webp
          if ! git diff --cached --quiet; then
            git commit -m "Optimize Warbeck WebP drawings below 150KB [skip ci]"
            git push origin HEAD:feature/warbeck-total-refurb-20261117
          fi
